  <text x="842" y="218" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">首尾淡出 (0.3s)</text>

  <!-- Data Table -->
  <rect x="40" y="244" width="920" height="252" rx="10" fill="url(#cardGrad)" stroke="#212a3d" stroke-width="1"/>
  
  <!-- Table Header -->
  <rect x="40" y="244" width="920" height="38" rx="10" fill="#0f141d" stroke="#212a3d" stroke-width="1"/>
  <text x="60" y="268" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">曲目清单</text>
  <text x="120" y="268" fill="#64748b" font-family="monospace" font-size="11">1 tracks</text>

