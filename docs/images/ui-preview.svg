  <text x="640" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">专辑:</text>
  <rect x="675" y="152" width="265" height="22" rx="4" fill="#0d1117" stroke="#212a3d" stroke-width="1"/>
  <text x="683" y="167" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">心墙</text>

