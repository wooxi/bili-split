  <rect x="675" y="180" width="265" height="22" rx="4" fill="#0d1117" stroke="#212a3d" stroke-width="1"/>
  <text x="683" y="195" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">MP3 (320Kbps)</text>

  <circle cx="682" cy="214" r="5" fill="#10b981"/>
  <text x="694" y="218" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">响度均衡 (EBU R128)</text>
