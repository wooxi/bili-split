  <rect x="892" y="250" width="52" height="24" rx="4" fill="#1a2233" stroke="#28344c" stroke-width="1"/>
  <text x="906" y="266" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11">+ 加曲</text>

