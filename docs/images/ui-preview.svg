  <text x="60" y="302" fill="#64748b" font-family="monospace" font-size="11">#</text>
  <text x="100" y="302" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">歌手</text>
  <text x="260" y="302" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">歌名</text>
  <text x="560" y="302" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">时间范围</text>
  <text x="730" y="302" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">时长</text>
  <text x="890" y="302" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">操作</text>

  <line x1="40" y1="312" x2="960" y2="312" stroke="#1f283d" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="60" y="342" fill="#64748b" font-family="monospace" font-size="11">1</text>
  <text x="100" y="342" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">Agroce</text>
  <text x="260" y="342" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="500" font-size="12">心墙 (Suno AI)</text>
  <rect x="365" y="330" width="22" height="15" rx="3" fill="#581c87" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.3"/>
  <text x="369" y="341" fill="#c084fc" font-family="monospace" font-size="9">AI</text>
  
  <text x="560" y="342" fill="#94a3b8" font-family="monospace" font-size="11">00:00 ~ 05:55</text>
  <text x="730" y="342" fill="#94a3b8" font-family="monospace" font-size="11">05:55</text>
  
  <text x="886" y="342" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">✨ ⇄ 🗑️</text>

  <!-- Table Footer Submit Bar -->
  <rect x="40" y="450" width="920" height="46" rx="0" fill="#0d1118" stroke="#212a3d" stroke-width="1"/>
  <text x="60" y="478" fill="#10b981" font-family="monospace" font-size="11">就绪 · 自动写入 /music</text>
  <rect x="800" y="458" width="144" height="30" rx="6" fill="url(#accentGrad)"/>
  <text x="830" y="477" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="600" font-size="11">执行导出并归档</text>

  <!-- Persistent Global Audio Player Bar -->
  <rect x="0" y="508" width="1000" height="72" fill="#0e131b" stroke="#1f283d" stroke-width="1"/>
  
  <!-- Left Track Info -->
  <rect x="24" y="522" width="44" height="44" rx="6" fill="#1a2233" stroke="#2a354d" stroke-width="1"/>
  <polygon points="24,550 40,535 55,550 68,540 68,566 24,566" fill="#10b981" fill-opacity="0.3"/>
  <text x="80" y="540" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">心墙 (Suno AI)</text>
  <text x="80" y="556" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Agroce</text>

  <!-- Center Player Controls -->
  <circle cx="500" cy="535" r="14" fill="#ffffff"/>
  <polygon points="496,529 506,535 496,541" fill="#0c1017"/>
  <text x="460" y="539" fill="#94a3b8" font-size="12">↺ 5s</text>
  <text x="526" y="539" fill="#94a3b8" font-size="12">5s ↻</text>

  <!-- Scrubber -->
  <text x="320" y="563" fill="#64748b" font-family="monospace" font-size="10">01:42</text>
  <rect x="360" y="559" width="280" height="4" rx="2" fill="#1e293b"/>
  <rect x="360" y="559" width="90" height="4" rx="2" fill="#10b981"/>
  <circle cx="450" cy="561" r="5" fill="#10b981"/>
  <text x="650" y="563" fill="#64748b" font-family="monospace" font-size="10">05:55</text>

  <!-- Right Tools -->
  <text x="890" y="548" fill="#94a3b8" font-size="13">💾 ⬇️ 🔊</text>
  <rect x="925" y="545" width="50" height="4" rx="2" fill="#1e293b"/>
  <rect x="925" y="545" width="38" height="4" rx="2" fill="#10b981"/>
</svg>