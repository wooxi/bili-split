<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a26"/>
      <stop offset="100%" stop-color="#10151f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1000" height="580" fill="url(#bgGrad)"/>

  <!-- Top System Bar -->
  <rect x="0" y="0" width="1000" height="56" fill="#0d1118" stroke="#1e2638" stroke-width="1"/>
  <rect x="24" y="14" width="28" height="28" rx="8" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
  <circle cx="38" cy="28" r="6" stroke="#10b981" stroke-width="2" fill="none"/>
  <text x="64" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="1">BILISPLIT</text>
  
  <!-- View Switcher -->
  <rect x="180" y="12" width="168" height="32" rx="8" fill="#131924" stroke="#1f283d" stroke-width="1"/>
  <rect x="184" y="15" width="76" height="26" rx="6" fill="#1f283d"/>
  <text x="202" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">工作台</text>
  <text x="278" y="32" fill="#94a3b8" font-family="-apple-system, sans-serif" font-weight="500" font-size="12">媒体库</text>

  <!-- Server Badge -->
  <rect x="850" y="14" width="126" height="28" rx="6" fill="#131924" stroke="#1f283d" stroke-width="1"/>
  <circle cx="866" cy="28" r="3" fill="#10b981"/>
  <text x="878" y="32" fill="#94a3b8" font-family="monospace" font-size="11">/music</text>

  <!-- Main Container -->
  <!-- Search / Input Panel -->
  <rect x="40" y="76" width="920" height="48" rx="10" fill="url(#cardGrad)" stroke="#212a3d" stroke-width="1" filter="url(#shadow)"/>
  <circle cx="64" cy="100" r="6" stroke="#64748b" stroke-width="2" fill="none"/>
  <line x1="68" y1="104" x2="74" y2="110" stroke="#64748b" stroke-width="2"/>
  <text x="88" y="105" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="13">https://www.bilibili.com/video/BV1wgjN6fELp/</text>
  <rect x="860" y="84" width="88" height="32" rx="8" fill="url(#accentGrad)"/>
  <text x="888" y="104" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="600" font-size="12">解析</text>

  <!-- Metadata Card -->
  <rect x="40" y="136" width="920" height="96" rx="10" fill="url(#cardGrad)" stroke="#212a3d" stroke-width="1"/>
  <rect x="56" y="148" width="120" height="72" rx="6" fill="#1a2233" stroke="#2a354d" stroke-width="1"/>
  <!-- Image placeholder art -->
  <polygon points="56,200 90,170 120,195 150,165 176,200 176,220 56,220" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="95" cy="165" r="8" fill="#10b981" fill-opacity="0.4"/>
  
  <text x="192" y="168" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">【摇滚现场】心墙-Suno Hi-Res音质</text>
  <rect x="192" y="178" width="52" height="18" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
