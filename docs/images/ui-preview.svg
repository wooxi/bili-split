  <text x="254" y="191" fill="#94a3b8" font-family="monospace" font-size="11">05:55</text>
  <text x="192" y="214" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">UP主: <tspan fill="#cbd5e1">Agroce</tspan></text>

