<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>BiliSplit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            base: '#0c1017',
                            card: '#131924',
                            active: '#1a2232',
                            border: '#212a3d',
                            hover: '#182030'
                        },
                        accent: {
                            DEFAULT: '#10b981',
                            hover: '#059669',
                            muted: '#064e3b'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-surface-base text-slate-200 h-screen flex flex-col font-sans selection:bg-accent selection:text-white overflow-hidden">

    <!-- 顶部系统栏 -->
    <header class="h-14 border-b border-surface-border bg-surface-base px-5 flex items-center justify-between flex-shrink-0 z-30">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                    <i data-lucide="disc-3" class="w-4 h-4"></i>
                </div>
                <span class="font-bold text-sm tracking-wider uppercase text-white">BiliSplit</span>
            </div>

            <!-- 主视图切换 -->
            <nav class="flex items-center gap-1 bg-surface-card p-1 rounded-lg border border-surface-border text-xs">
                <button id="viewWorkstationBtn" class="px-3 py-1 rounded-md bg-surface-active text-white font-medium transition cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="scissors" class="w-3.5 h-3.5 text-emerald-400"></i>
                    <span>工作台</span>
                </button>
                <button id="viewLibraryBtn" class="px-3 py-1 rounded-md text-slate-400 hover:text-slate-200 transition cursor-pointer flex items-center gap-1.5">
                    <i data-lucide="library" class="w-3.5 h-3.5"></i>
                    <span>媒体库</span>
                    <span id="libraryCountTag" class="px-1.5 py-0.2 rounded-full bg-slate-800 text-[10px] text-slate-400 font-mono">0</span>
                </button>
            </nav>
        </div>

        <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-surface-card px-3 py-1 rounded-md border border-surface-border font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                <span id="headerPathBadge">/music</span>
            </div>
        </div>
    </header>

    <!-- 主工作区域 (带自适应滚动) -->
    <div class="flex-1 overflow-hidden relative">

        <!-- 视图 1: 工作台 -->
        <main id="workstationView" class="h-full overflow-y-auto px-6 py-6 max-w-6xl mx-auto space-y-6 pb-24">
            
            <!-- URL 提取面板 -->
            <div class="bg-surface-card border border-surface-border rounded-xl p-3 flex items-center gap-2 shadow-sm">
                <div class="pl-2 text-slate-500">
                    <i data-lucide="link" class="w-4 h-4"></i>
                </div>
                <input 
                    type="text" 
                    id="urlInput"
                    placeholder="输入 Bilibili 视频链接或 BV 号..."
                    class="flex-1 bg-transparent px-2 py-1.5 text-sm text-slate-100 placeholder-slate-500 outline-none"
                >
                <button 
                    id="parseBtn" 
                    class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-medium rounded-lg text-xs transition flex items-center gap-1.5 cursor-pointer shadow-sm"
                >
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    <span>解析</span>
                </button>
            </div>

            <!-- 空状态 -->
            <div id="emptyState" class="py-24 text-center text-slate-600 space-y-3">
                <div class="w-12 h-12 rounded-2xl bg-surface-card border border-surface-border flex items-center justify-center mx-auto text-slate-500">
                    <i data-lucide="music" class="w-6 h-6"></i>
                </div>
                <p class="text-xs">等待输入视频链接开始拆解</p>
            </div>

            <!-- 视频解析与曲目编辑面板 -->
            <div id="editorPanel" class="hidden space-y-4">
                
                <!-- 视频元数据与全局参数卡片 -->
                <div class="bg-surface-card border border-surface-border rounded-xl p-4 flex flex-col md:flex-row gap-5 items-start">
                    <img id="videoCover" src="" referrerpolicy="no-referrer" alt="" class="w-32 h-20 object-cover rounded-lg border border-surface-border bg-slate-900 flex-shrink-0">
                    
                    <div class="flex-1 min-w-0 space-y-2">
                        <div class="flex items-center gap-2">
                            <span id="sourceBadge" class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium"></span>
                            <span id="durationBadge" class="text-[10px] text-slate-400 font-mono"></span>
                        </div>
                        <h2 id="videoTitle" class="text-sm font-semibold text-white truncate"></h2>
                        <div class="flex items-center gap-4 text-xs text-slate-400">
                            <span>UP: <span id="videoOwner" class="text-slate-200"></span></span>
                        </div>
                    </div>

                    <!-- 导出选项 -->
                    <div class="w-full md:w-80 flex flex-col gap-2.5 pt-3 md:pt-0 md:border-l md:border-surface-border md:pl-5 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="text-slate-400 w-12 flex-shrink-0">专辑</span>
                            <input id="albumInput" type="text" class="flex-1 bg-surface-base px-2.5 py-1.5 rounded-lg border border-surface-border text-white text-xs outline-none focus:border-emerald-500">
                        </div>

                        <div class="flex items-center gap-2">
                            <span class="text-slate-400 w-12 flex-shrink-0">格式</span>
                            <select id="formatSelect" class="flex-1 bg-surface-base px-2 py-1.5 rounded-lg border border-surface-border text-white text-xs outline-none focus:border-emerald-500">
                                <option value="mp3" selected>MP3 (320Kbps)</option>
                                <option value="flac">FLAC (Lossless)</option>
                                <option value="m4a">M4A (AAC)</option>
                            </select>
                        </div>

                        <div class="flex items-center gap-4 pt-1 text-[11px] text-slate-400">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" id="loudnormToggle" checked class="rounded border-slate-700 text-emerald-500 bg-surface-base">
                                <span>响度均衡 (EBU R128)</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" id="fadeToggle" checked class="rounded border-slate-700 text-emerald-500 bg-surface-base">
                                <span>首尾淡出 (0.3s)</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 曲目表格 -->
                <div class="bg-surface-card border border-surface-border rounded-xl overflow-hidden">
                    <div class="px-4 py-3 border-b border-surface-border flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-white">曲目清单</span>
                            <span id="trackCountBadge" class="text-slate-500 font-mono">0 tracks</span>
                        </div>

                        <div class="flex items-center gap-2">
                            <button id="aiNormalizeAllBtn" class="px-2.5 py-1 bg-purple-900/30 hover:bg-purple-900/50 border border-purple-500/30 text-purple-300 rounded-md transition cursor-pointer flex items-center gap-1">
                                <i data-lucide="sparkles" class="w-3 h-3 text-purple-400"></i>
                                <span>AI 规范</span>
                            </button>
                            <button id="swapAllBtn" class="px-2.5 py-1 bg-surface-active hover:bg-surface-hover border border-surface-border text-slate-300 rounded-md transition cursor-pointer flex items-center gap-1">
                                <i data-lucide="arrow-left-right" class="w-3 h-3"></i>
                                <span>互换歌手/歌名</span>
                            </button>
                            <button id="addTrackBtn" class="px-2.5 py-1 bg-surface-active hover:bg-surface-hover border border-surface-border text-slate-300 rounded-md transition cursor-pointer flex items-center gap-1">
                                <i data-lucide="plus" class="w-3 h-3"></i>
                                <span>加曲</span>
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-surface-base/80 text-slate-400 font-medium border-b border-surface-border text-[11px]">
                                <tr>
                                    <th class="py-2.5 px-3 w-10 text-center">#</th>
                                    <th class="py-2.5 px-3 w-48">歌手</th>
                                    <th class="py-2.5 px-3">歌名</th>
                                    <th class="py-2.5 px-3 w-36 text-center">时间范围</th>
                                    <th class="py-2.5 px-3 w-16 text-center">时长</th>
                                    <th class="py-2.5 px-3 w-24 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="trackTableBody" class="divide-y divide-surface-border/50 font-sans">
                                <!-- 动态注入表格行 -->
                            </tbody>
                        </table>
                    </div>

                    <!-- 底部提交条 -->
                    <div class="p-3 bg-surface-base border-t border-surface-border flex items-center justify-between">
                        <div id="taskStatusText" class="text-xs text-slate-400 font-mono">就绪</div>
                        <div class="flex items-center gap-3">
                            <button 
                                id="startProcessBtn"
                                class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-medium rounded-lg text-xs transition flex items-center gap-1.5 cursor-pointer shadow-sm"
                            >
                                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                                <span>执行导出并归档</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 进度指示 -->
                <div id="progressBox" class="hidden bg-surface-card border border-surface-border rounded-xl p-4 space-y-2">
                    <div class="flex items-center justify-between text-xs">
                        <div class="flex items-center gap-2">
                            <i id="progressSpinner" data-lucide="loader-2" class="w-3.5 h-3.5 text-emerald-400 animate-spin"></i>
                            <span id="progressStep" class="text-slate-200">处理中...</span>
                        </div>
                        <span id="progressPct" class="font-mono text-emerald-400">0%</span>
                    </div>
                    <div class="w-full h-1.5 bg-surface-base rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-emerald-500 w-0 transition-all duration-200"></div>
                    </div>
                </div>

                <!-- 完成输出区 -->
                <div id="completedBox" class="hidden bg-surface-card border border-surface-border rounded-xl p-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-xs text-emerald-400 font-medium">
                            <i data-lucide="check" class="w-4 h-4"></i>
                            <span>归档已完成</span>
                        </div>
                        <a id="downloadZipBtn" href="#" class="px-3 py-1 bg-surface-active hover:bg-surface-hover border border-surface-border text-slate-200 rounded-md text-xs transition flex items-center gap-1.5">
                            <i data-lucide="archive" class="w-3.5 h-3.5"></i>
                            <span>下载 ZIP 包</span>
                        </a>
                    </div>
                    <div id="outputFileList" class="space-y-1.5 max-h-60 overflow-y-auto"></div>
                </div>

            </div>
        </main>

        <!-- 视图 2: 媒体库 -->
        <main id="libraryView" class="hidden h-full overflow-y-auto px-6 py-6 max-w-6xl mx-auto space-y-4 pb-24">
            <div class="flex items-center justify-between gap-4">
                <div class="relative flex-1 max-w-md">
                    <i data-lucide="search" class="w-3.5 h-3.5 text-slate-500 absolute left-3 top-2.5"></i>
                    <input 
                        type="text" 
                        id="librarySearchInput" 
                        placeholder="搜索已归档歌曲、歌手、专辑..." 
                        class="w-full pl-8 pr-3 py-1.5 bg-surface-card border border-surface-border rounded-lg text-xs text-slate-200 placeholder-slate-500 outline-none focus:border-emerald-500"
                    >
                </div>
                <div class="text-xs text-slate-500 font-mono" id="libraryStats">0 首曲目</div>
            </div>

            <!-- 曲库列表表格 -->
            <div class="bg-surface-card border border-surface-border rounded-xl overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-surface-base text-slate-400 font-medium border-b border-surface-border text-[11px]">
                            <tr>
                                <th class="py-2.5 px-3 w-10 text-center">#</th>
                                <th class="py-2.5 px-3">曲名 / 歌手</th>
                                <th class="py-2.5 px-3 w-48">专辑</th>
                                <th class="py-2.5 px-3 w-20 text-center">格式</th>
                                <th class="py-2.5 px-3 w-20 text-center">大小</th>
                                <th class="py-2.5 px-3 w-24 text-center">时间</th>
                                <th class="py-2.5 px-3 w-24 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="libraryTableBody" class="divide-y divide-surface-border/50">
                            <!-- 动态注入 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

    </div>

    <!-- 全局底部持久化音频播放栏 -->
    <div id="playerBar" class="h-16 border-t border-surface-border bg-surface-card/95 backdrop-blur-md px-6 flex items-center justify-between fixed bottom-0 inset-x-0 z-50">
        <!-- 曲目信息 -->
        <div class="flex items-center gap-3 w-1/4 min-w-0">
            <div class="w-10 h-10 rounded-lg bg-surface-base border border-surface-border flex items-center justify-center flex-shrink-0 text-slate-500 overflow-hidden">
                <i id="playerCoverPlaceholder" data-lucide="music" class="w-5 h-5"></i>
                <img id="playerCoverImg" src="" class="w-full h-full object-cover hidden" alt="">
            </div>
            <div class="min-w-0">
                <p id="playerTitle" class="text-xs font-semibold text-white truncate">未在播放</p>
                <p id="playerArtist" class="text-[11px] text-slate-400 truncate">-</p>
            </div>
        </div>

        <!-- 播放器核心控件 -->
        <div class="flex flex-col items-center gap-1.5 flex-1 max-w-lg">
            <div class="flex items-center gap-4">
                <button id="playerRewindBtn" class="text-slate-400 hover:text-white transition cursor-pointer">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                </button>
                <button id="playerPlayBtn" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition cursor-pointer shadow">
                    <i id="playerPlayIcon" data-lucide="play" class="w-4 h-4 fill-current ml-0.5"></i>
                </button>
                <button id="playerForwardBtn" class="text-slate-400 hover:text-white transition cursor-pointer">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                </button>
            </div>
            
            <div class="w-full flex items-center gap-2 text-[10px] font-mono text-slate-500">
                <span id="playerCurrentTime">00:00</span>
                <input type="range" id="playerSeeker" min="0" max="100" value="0" class="flex-1 h-1 bg-surface-base rounded-lg appearance-none cursor-pointer accent-emerald-500">
                <span id="playerDuration">00:00</span>
            </div>
        </div>

        <!-- 辅助工具 (音量、单曲下载) -->
        <div class="flex items-center justify-end gap-3 w-1/4">
            <a id="playerDownloadBtn" href="#" download="" class="text-slate-400 hover:text-emerald-400 transition" title="下载原文件">
                <i data-lucide="download" class="w-4 h-4"></i>
            </a>
            <div class="flex items-center gap-1.5 text-slate-400">
                <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                <input type="range" id="playerVolume" min="0" max="1" step="0.05" value="0.8" class="w-16 h-1 bg-surface-base rounded-lg appearance-none cursor-pointer accent-emerald-500">
            </div>
        </div>
    </div>

    <!-- 隐藏的全局音频对象 -->
    <audio id="globalAudio"></audio>

    <script src="/static/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
